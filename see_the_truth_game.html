const EW=168,EH=176,ECX=83.98,ECY=87.72,EBX=63,EBY=82,EBW=44,EBH=26;
let seed=5;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];};
const easeBack=x=>{x=Math.min(Math.max(x,0),1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const bounce=x=>{x=Math.min(Math.max(x,0),1);const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d){x-=1.5/d;return n*x*x+.75;}if(x<2.5/d){x-=2.25/d;return n*x*x+.9375;}x-=2.625/d;return n*x*x+.984375;};

// ---- sky, stars, mountains, floor (parallax layers) ----
const SKY=[[0,'#04041a'],[26,'#080628'],[48,'#100a3a'],[68,'#1b0d4e'],[86,'#2c1066'],[102,'#44157c'],[116,'#661b8e'],[128,'#8f2299'],[137,'#c53aa6'],[142,'#ff6fc0']];
function sky(){for(let i=0;i<SKY.length;i++){const y0=SKY[i][0],y1=i+1<SKY.length?SKY[i+1][0]:HY;px(0,y0,W,y1-y0,SKY[i][1]);
  if(i+1<SKY.length){const nc=SKY[i+1][1];for(let x=0;x<W;x+=4)px(x,y1-3,1,1,nc);for(let x=0;x<W;x+=2)px(x,y1-2,1,1,nc);px(0,y1-1,W,1,nc);}}}
const stars=[];[[44,3,'#5260c8'],[30,7,'#a9b6ff'],[16,14,'#ffffff']].forEach(([n,v,c],l)=>{for(let i=0;i<n;i++)stars.push({x:rnd()*W,y:rnd()*(HY-14),v,c,p:rnd()*6,big:l===2&&rnd()<.4});});
function drawStars(t){for(const s of stars){if(Math.sin(t*3+s.p)<-.6)continue;const x=Math.round(((s.x-t*s.v-CAMX*s.v*.06)%W+W)%W),y=Math.round(s.y);px(x,y,1,1,s.c);if(s.big){px(x-1,y,3,1,s.c);px(x,y-1,1,3,s.c);}}}
function mountains(t){[[34,'#1a0c42',3.5,0,'#3a1a84'],[20,'#2a1060',8,2,'#9a45d8']].forEach(([b,col,sp,ph,rim])=>{
  for(let x=0;x<W;x++){const u=x+t*sp+CAMX*sp*.1;const h=Math.round(b*.45+b*.4*Math.abs(Math.sin(u*.034+ph))+b*.25*Math.abs(Math.sin(u*.09+ph*2)));px(x,HY-h,1,h,col);px(x,HY-h,1,1,rim);}});}
function floor(t,step){
  const fb=['#2b0f56','#220c48','#1a0a3a','#14072f','#0f0626','#0a041d'],fh=H-HY;
  fb.forEach((c,i)=>px(0,HY+Math.floor(i*fh/6),W,Math.ceil(fh/6)+1,c));px(0,HY,W,1,'#ff8fd6');
  const col=['#d23fd8','#7a63ff','#2fd8ff'][step%3],N=9,fr=(t*.55)%1;
  for(let i=0;i<N;i++){const u=(i+fr)/N,y=Math.round(HY+fh*Math.pow(u,2.1));if(y>HY+1&&y<H)px(0,y,W,1,u>.55?col:(u>.25?'#7a229f':'#4c1a78'));}
  for(let j=-10;j<=10;j++){const xb=CX+j*34-(CAMX%34);for(let y=HY+2;y<H;y++){const x=Math.round(CX+(xb-CX)*(y-HY)/fh);if(x>=0&&x<W)px(x,y,1,1,(y-HY)>fh*.45?col:'#6a2092');}}
}

// ---- dynamic lighting: pulsing aura around the emblem and glow on the floor ----
const [AUC,AUX]=mk(W,H),AUI=AUX.createImageData(W,H);
const AC=[[255,70,220],[200,80,255],[90,120,255],[60,220,255]],AL=[0,40,75,115,160];
function aura(t,vis){
  const d=AUI.data;d.fill(0);const cx=EX+ECX,cy=EY+ECY+EOY,R0=87,pulse=.5+.5*Math.sin(t*2.6),spread=44+12*pulse;
  for(let y=cy-R0-70;y<cy+R0+70;y++)for(let x=cx-R0-70;x<cx+R0+70;x++){
    if(x<0||x>=W||y<0||y>=H)continue;const dx=x-cx,dy=y-cy,dd=Math.sqrt(dx*dx+dy*dy)-R0;if(dd<-4||dd>spread)continue;
    const s=(1-Math.max(dd,0)/spread)*4;let l=Math.floor(s);if((s-l)>.5&&((x+y)&1))l++;if(l<=0)continue;
    const c=AC[Math.min(3,Math.floor(Math.max(dd,0)/spread*4))],k=(y*W+x)*4;d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=AL[Math.min(l,4)]*vis;}
  for(let y=HY+22;y<H;y++)for(let x=CX-110;x<CX+110;x++){const e=Math.sqrt(Math.pow((x-CX)/105,2)+Math.pow((y-212)/15,2));if(e>1)continue;
    const s=(1-e)*3.2;let l=Math.floor(s);if((s-l)>.5&&((x+y)&1))l++;if(l<=0)continue;const k=(y*W+x)*4;
    if(d[k+3]<30){d[k]=255;d[k+1]=70+pulse*60;d[k+2]=220;d[k+3]=AL[Math.min(l,4)]*.85*vis;}}
  AUX.putImageData(AUI,0,0);ctx.globalCompositeOperation='lighter';ctx.drawImage(AUC,0,0);ctx.globalCompositeOperation='source-over';
}

    if(P.y>=GY){P.y=GY;P.air=false;P.vy=0;if(P.st!=='hurt')setSt('land');}}
  const s=P.st;
  if(s==='hurt'){if(!P.air){P.x+=P.vx*dt;P.vx*=.88;}if(P.t>.6&&!P.air)setSt('idle');}
  else if(s==='attack'){if(P.t>.36)setSt('idle');}
  else if(s==='puff'){if(P.t>1)setSt('idle');if(P.t>.1&&P.t<.7&&Math.floor(P.t*30)!==P.pf){P.pf=Math.floor(P.t*30);const e=EMBER[92];smoke(P.x+(e[0]-32)*P.face,P.y-63+e[1],1,1);}}
  else if(s==='land'){if(P.t>.33)setSt('idle');}
  else if(!P.air){
    if(hit.Space&&!keys.KeyX){P.vy=-260;P.air=true;setSt('jump');}
    else if(hit.KeyZ)setSt('attack');
    else if(hit.KeyC){setSt('puff');P.pf=-1;}
    else if(keys.KeyX){if(dir){P.face=dir;P.x+=dir*30*dt;setSt('crawl');}else setSt('crouch');}
    else if(dir){if(keys.ArrowUp){setSt('back');P.x+=dir*40*dt;}else{P.face=dir;setSt('run');P.x+=dir*96*dt;}}
    else{const m=['pull','count','spread','pocket','settle'];
      if(m.includes(s)){if(s==='count'){if(hit.KeyV)setSt('spread');}else if(adone(s,P.t))setSt(s==='pull'?'count':s==='spread'?'pocket':s==='pocket'?'settle':'idle');}
      else if(hit.KeyV)setSt('pull');else setSt('idle');}
  }
  P.x=Math.min(WORLD-16,Math.max(16,P.x));
  if(P.st==='attack'&&P.t>.19&&P.t<.32)for(const o of orbs)if(o.alive&&Math.abs(o.x-(P.x+P.face*24))<20&&Math.abs((GY-22)-(GY-24))<30){o.alive=false;spark(o.x,GY-26,16,['#fff','#ff5ee8','#6fe8ff'],80);}
  for(const o of orbs){if(!o.alive)continue;o.x+=o.d*34*dt;if(o.x>o.b)o.d=-1;if(o.x<o.a)o.d=1;
    if(P.inv<=0&&P.st!=='hurt'&&Math.abs(o.x-P.x)<13&&P.y>GY-26){setSt('hurt');P.vx=(P.x<o.x?-1:1)*110;P.vy=-130;P.air=true;P.hp--;P.inv=1.3;spark(P.x,P.y-30,8,['#ffe66d','#fff'],50);if(P.hp<=0){shakeT=.4;resetPlay();}}}
  if(P.x>WORLD-48)won=true;
}
function playAnim(){const s=P.st;if(s==='jump'){if(P.t<.12)return['jumpup',P.t];if(P.vy<-90)return['rise',P.t];if(P.vy<=90)return['peak',P.t];return['fall',P.t];}
  if(s==='idle'||s==='run'||s==='back'||s==='crawl')return[s,G];return[s,P.t];}
function drawPlay(dt){
  const ts=G-s0;if(!won)updatePlayer(dt);cam=Math.round(Math.min(WORLD-W,Math.max(0,P.x-CX)));CAMX=cam;
  bg(G,0);
  // lifa waits at the end
  const lx=WORLD-30-cam;spr('lifa',G,lx,GY,0,0);
  for(const o of orbs){if(!o.alive)continue;const ox=Math.round(o.x-cam),oy=GY-26+Math.round(Math.sin(G*4+o.p)*2),r=Math.floor(G*6+o.p)%2?7:8;
    for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));px(ox-w,oy+dy,2*w+1,1,Math.abs(dy)>r-2?'#ff5ee8':'#7a1fb0');}
    px(ox-3,oy-2,7,5,'#fff');px(ox-1+o.d,oy-1,3,3,'#12042c');}
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(Math.round(P.x-cam)-14,Math.round(P.y)-2,28,3);
  const [an,at]=playAnim();if(P.inv<=0||Math.floor(G*20)%2)spr(an,at,P.x-cam,P.y,P.face<0,an==='run'?-.07:0);
  fxDraw(dt,cam);
  for(let i=0;i<3;i++)heart(8+i*14,8,i<P.hp?'#ff4d6d':'#3a3050');
  T('ACT 1-1',312,16,8,'#a49bd6','right','#12042c');
  if(won){px(60,86,200,44,'rgba(10,4,32,.92)');T('TO BE CONTINUED...',CX,112,8,'#ffe66d','center');if(Math.floor(G*2)%2)T('PRESS ENTER',CX,124,8,'#fff','center');}
  if(ts<.5){ctx.fillStyle='rgba(4,4,26,'+(1-ts/.5)+')';ctx.fillRect(0,0,W,H);}
}
// ================= MAIN LOOP =================
let last=0;
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;DT=dt;G+=dt;CAMX=0;EOY=0;EALPHA=1;
  if(scene==='title')drawTitleScene();else if(scene==='act')drawAct();else if(scene==='controls')drawControls();else if(scene==='cutscene')drawCut(dt);else drawPlay(dt);
  if(trans){trans.t+=dt;if(!trans.sw&&trans.t>=.4){trans.sw=1;scene=trans.to;enterScene(scene);}const a=trans.t<.4?trans.t/.4:Math.max(0,1-(trans.t-.4)/.4);
    ctx.fillStyle='rgba(4,4,26,'+a+')';ctx.fillRect(0,0,W,H);if(trans.t>=.8)trans=null;}
  for(const k in hit)delete hit[k];requestAnimationFrame(frame);
}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(!keys[e.code])hit[e.code]=1;keys[e.code]=1;
  if(e.code==='Enter')confirm();
  if(scene==='title'&&menuOpen&&!trans){if(e.code==='ArrowUp'||e.code==='ArrowDown')sel=1-sel;if(e.code==='Escape')menuOpen=false;}});
addEventListener('keyup',e=>{keys[e.code]=0;});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(scene==='title'&&menuOpen&&!trans&&x>88&&x<232&&y>176&&y<216){sel=y<201?0:1;choose();}else confirm();});
let loaded=0;const onl=()=>{if(++loaded===3)begin();};for(const k in IMG)IMG[k].onload=onl;
function begin(){
  const fonts=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('16px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
  fonts.then(()=>{initEmblem();buildTitle();enterScene('title');last=performance.now();requestAnimationFrame(frame);});
}

</script>
